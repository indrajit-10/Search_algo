<title>How the search works</title>

<style>
  :root{
    --paper:#ffffff;
    --ink:#16181d;
    --muted:#5c6270;
    --rule:#c9cdd6;
    --hair:#e4e7ec;
    --signal:#0b5fbf;
    --signal-wash:#eaf1fb;
    --rust:#a8341b;
    --rust-wash:#fbeeea;

    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", Menlo,
            Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14161a; --ink:#e7eaf0; --muted:#98a0ae;
      --rule:#333944; --hair:#252a33;
      --signal:#77a9f5; --signal-wash:#1a2331;
      --rust:#e58a70; --rust-wash:#2c1f1c;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14161a; --ink:#e7eaf0; --muted:#98a0ae;
    --rule:#333944; --hair:#252a33;
    --signal:#77a9f5; --signal-wash:#1a2331;
    --rust:#e58a70; --rust-wash:#2c1f1c;
  }
  :root[data-theme="light"]{
    --paper:#ffffff; --ink:#16181d; --muted:#5c6270;
    --rule:#c9cdd6; --hair:#e4e7ec;
    --signal:#0b5fbf; --signal-wash:#eaf1fb;
    --rust:#a8341b; --rust-wash:#fbeeea;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{ max-width:860px; margin:0 auto; padding:44px 32px 60px; }

  .masthead{ border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:22px; }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); margin:0 0 9px;
  }
  h1{
    font-family:var(--serif); font-weight:600; font-size:34px; line-height:1.1;
    margin:0 0 7px; letter-spacing:-.01em;
  }
  .standfirst{ margin:0; max-width:60ch; color:var(--muted); font-size:15.5px; }

  figure{ margin:0; }
  figure svg{ width:100%; height:auto; display:block; }
  figcaption{
    margin-top:14px; padding-top:11px; border-top:1px solid var(--hair);
    font-size:13px; color:var(--muted); max-width:70ch;
  }

  @page{ size:A4 portrait; margin:12mm; }
  @media print{
    :root{
      --paper:#fff; --ink:#000; --muted:#444; --rule:#999; --hair:#ccc;
      --signal:#0b5fbf; --signal-wash:#eaf1fb; --rust:#a8341b; --rust-wash:#fbeeea;
    }
    body{ font-size:10pt; }
    .sheet{ max-width:none; padding:0; }
    h1{ font-size:18pt; margin-bottom:3px; }
    .standfirst{ font-size:9.5pt; max-width:80ch; }
    .masthead{ padding-bottom:7px; margin-bottom:9px; }
    .eyebrow{ font-size:8pt; margin-bottom:5px; }
    /* The whole thing is meant to be one sheet. This is what holds it there. */
    figure svg{ max-height:233mm; width:auto; max-width:100%; margin:0 auto; }
    figcaption{ margin-top:7px; padding-top:6px; font-size:8.5pt; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>

<div class="sheet">

  <header class="masthead">
    <p class="eyebrow">123Greetings &middot; card search</p>
    <h1>How the search works</h1>
    <p class="standfirst">
      Six steps, and one real search making its way through them.
    </p>
  </header>

  <figure>
    <svg viewBox="0 0 900 1054" role="img"
         aria-label="The card search in six steps, with the query mom birthdya worked through each one. Someone types mom birthdya. Step one tidies the text. Step two fixes the spelling to mom birthday. Step three works out that it means a birthday card for a mother. Step four finds every card that fits, weighing each word by how rare it is and by where on the card it sits: title counts three, labels two and a half, section two, blurb one. Step five checks whether enough came back and widens the search if not, looping back. Step six puts the best first: how well a card matches decides the order, and newness can add at most fifteen per cent on top of that, halving every five years. The result is 39 birthday cards for mothers in about a millisecond.">
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
        <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--signal)"/>
        </marker>
      </defs>

      <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
         fill="currentColor" color="currentColor">

        <text x="30" y="18" font-size="12" font-weight="700" fill="var(--muted)"
              letter-spacing="1.2" font-family="ui-monospace, Menlo, monospace">THE STEP</text>
        <text x="530" y="18" font-size="12" font-weight="700" fill="var(--signal)"
              letter-spacing="1.2" font-family="ui-monospace, Menlo, monospace">SOMEONE SEARCHES FOR…</text>

        <rect x="30" y="34" width="440" height="54" rx="27"
              fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="250" y="67" font-size="17" text-anchor="middle" font-weight="600">Someone types</text>

        <rect x="530" y="34" width="340" height="54" rx="6"
              fill="var(--signal-wash)" stroke="var(--signal)" stroke-width="1.5"/>
        <text x="700" y="68" font-size="20" text-anchor="middle" fill="var(--signal)"
              font-family="ui-monospace, Menlo, monospace">mom birthdya</text>

        <line x1="250" y1="88" x2="250" y2="122" stroke="currentColor"
              stroke-width="2" marker-end="url(#a)"/>

        <rect x="30" y="122" width="440" height="86" rx="6"
              fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="54" y="152" font-size="15" font-weight="700">1 &nbsp;Tidy up the text</text>
        <text x="54" y="177" font-size="14.5" fill="var(--muted)">Lower case, no punctuation.</text>
        <text x="54" y="197" font-size="14.5" fill="var(--muted)">An apostrophe joins a word — never splits it.</text>

        <text x="530" y="160" font-size="16" fill="var(--muted)"
              font-family="ui-monospace, Menlo, monospace">mom birthdya</text>
        <text x="530" y="188" font-size="13" fill="var(--rust)">This one step alone rescued</text>
        <text x="530" y="205" font-size="13" fill="var(--rust)">22,399 searches a period.</text>

        <line x1="250" y1="208" x2="250" y2="242" stroke="currentColor"
              stroke-width="2" marker-end="url(#a)"/>

        <rect x="30" y="242" width="440" height="86" rx="6"
              fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="54" y="272" font-size="15" font-weight="700">2 &nbsp;Fix the spelling</text>
        <text x="54" y="297" font-size="14.5" fill="var(--muted)">A word the cards don’t use becomes</text>
        <text x="54" y="317" font-size="14.5" fill="var(--muted)">the closest one they do.</text>

        <text x="530" y="280" font-size="16" fill="var(--signal)"
              font-family="ui-monospace, Menlo, monospace">mom birthday</text>
        <text x="530" y="308" font-size="13" fill="var(--muted)">The page says so: “Showing</text>
        <text x="530" y="325" font-size="13" fill="var(--muted)">results for mom birthday”.</text>

        <line x1="250" y1="328" x2="250" y2="362" stroke="currentColor"
              stroke-width="2" marker-end="url(#a)"/>

        <rect x="30" y="362" width="440" height="106" rx="6"
              fill="var(--signal-wash)" stroke="var(--signal)" stroke-width="2"/>
        <text x="54" y="392" font-size="15" font-weight="700" fill="var(--signal)">3 &nbsp;Work out what they mean</text>
        <text x="54" y="417" font-size="14.5" fill="var(--signal)">Not four loose words — an occasion,</text>
        <text x="54" y="437" font-size="14.5" fill="var(--signal)">a person, a mood, a kind of card.</text>
        <text x="54" y="457" font-size="13.5" fill="var(--muted)">Read from the labels on each card, not its blurb.</text>

        <rect x="530" y="378" width="160" height="34" rx="4"
              fill="none" stroke="var(--signal)" stroke-width="1.5"/>
        <text x="610" y="400" font-size="14" text-anchor="middle" fill="var(--signal)">a birthday card</text>
        <rect x="530" y="420" width="160" height="34" rx="4"
              fill="none" stroke="var(--signal)" stroke-width="1.5"/>
        <text x="610" y="442" font-size="14" text-anchor="middle" fill="var(--signal)">for a mother</text>

        <line x1="250" y1="468" x2="250" y2="502" stroke="currentColor"
              stroke-width="2" marker-end="url(#a)"/>

        <!-- step 4, with the weights -->
        <rect x="30" y="502" width="440" height="116" rx="6"
              fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="54" y="530" font-size="15" font-weight="700">4 &nbsp;Find every card that fits</text>
        <text x="54" y="553" font-size="14" fill="var(--muted)">A rare word counts for a lot. A word on nearly</text>
        <text x="54" y="571" font-size="14" fill="var(--muted)">every card counts for almost nothing.</text>
        <text x="54" y="592" font-size="13" fill="var(--muted)">And where it sits on the card counts too:</text>
        <g font-size="11" fill="var(--muted)"
           font-family="ui-monospace, Menlo, monospace">
          <text x="54" y="612">title</text>
          <rect x="94" y="602" width="54" height="11" rx="2" fill="var(--signal)"/>
          <text x="158" y="612">labels</text>
          <rect x="206" y="602" width="45" height="11" rx="2" fill="var(--signal)"/>
          <text x="261" y="612">section</text>
          <rect x="316" y="602" width="36" height="11" rx="2" fill="var(--signal)"/>
          <text x="362" y="612">blurb</text>
          <rect x="402" y="602" width="18" height="11" rx="2" fill="var(--rule)"/>
        </g>

        <text x="620" y="516" font-size="13.5" fill="var(--muted)">The blurb is the longest,</text>
        <text x="620" y="534" font-size="13.5" fill="var(--muted)">vaguest field, so it is the</text>
        <text x="620" y="552" font-size="13.5" fill="var(--muted)">safety net — never the</text>
        <text x="620" y="570" font-size="13.5" fill="var(--muted)">reason a card ranks first.</text>

        <line x1="250" y1="618" x2="250" y2="652" stroke="currentColor"
              stroke-width="2" marker-end="url(#a)"/>

        <!-- step 5, the decision -->
        <path d="M 250 652 L 400 706 L 250 760 L 100 706 Z"
              fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="250" y="698" font-size="15" text-anchor="middle" font-weight="600">5 &nbsp;Enough</text>
        <text x="250" y="720" font-size="15" text-anchor="middle" font-weight="600">cards?</text>

        <line x1="400" y1="706" x2="470" y2="706" stroke="var(--signal)"
              stroke-width="2" marker-end="url(#aS)"/>
        <text x="435" y="696" font-size="13" fill="var(--signal)" text-anchor="middle">no</text>

        <rect x="470" y="674" width="180" height="72" rx="6"
              fill="var(--signal-wash)" stroke="var(--signal)" stroke-width="2"/>
        <text x="560" y="700" font-size="15" font-weight="700" text-anchor="middle"
              fill="var(--signal)">Widen it</text>
        <text x="560" y="721" font-size="13" text-anchor="middle" fill="var(--signal)">give up the least</text>
        <text x="560" y="735" font-size="13" text-anchor="middle" fill="var(--signal)">important part</text>

        <path d="M 560 674 L 560 588 L 470 588" fill="none" stroke="var(--signal)"
              stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aS)"/>
        <text x="572" y="620" font-size="13" fill="var(--signal)">and look again,</text>
        <text x="572" y="638" font-size="13" fill="var(--signal)">keeping what</text>
        <text x="572" y="656" font-size="13" fill="var(--signal)">was found</text>

        <text x="676" y="762" font-size="13" fill="var(--signal)">There is always</text>
        <text x="676" y="779" font-size="13" fill="var(--signal)">something to show,</text>
        <text x="676" y="796" font-size="13" fill="var(--signal)">so an empty page</text>
        <text x="676" y="813" font-size="13" fill="var(--signal)">cannot happen.</text>

        <line x1="250" y1="760" x2="250" y2="794" stroke="currentColor"
              stroke-width="2" marker-end="url(#a)"/>
        <text x="262" y="782" font-size="13" fill="var(--muted)">yes</text>

        <rect x="30" y="794" width="440" height="150" rx="6"
              fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="54" y="822" font-size="15" font-weight="700">6 &nbsp;Put the best first</text>
        <text x="54" y="845" font-size="14" fill="var(--muted)">How well it matches decides the order. Newness</text>
        <text x="54" y="863" font-size="14" fill="var(--muted)">can add at most 15% on top of that:</text>

        <!-- the cap, drawn to scale: the small block IS 15% of the long one -->
        <g font-size="11" font-family="ui-monospace, Menlo, monospace">
          <rect x="54" y="876" width="240" height="13" rx="2" fill="var(--signal)"/>
          <rect x="294" y="876" width="36" height="13" rx="2" fill="var(--signal)"
                opacity="0.35"/>
          <text x="60" y="886" font-size="10" fill="#fff">how well it matches</text>
          <text x="338" y="886" fill="var(--muted)">+15% at most</text>
        </g>
        <text x="54" y="908" font-size="13" fill="var(--muted)">A card gets the full 15% the year it goes up, half of</text>
        <text x="54" y="925" font-size="13" fill="var(--muted)">that 5 years later, and almost none of it after 20.</text>

        <text x="530" y="843" font-size="13" fill="var(--muted)">So a clearly better old card still</text>
        <text x="530" y="861" font-size="13" fill="var(--muted)">wins. The cap is the whole point:</text>
        <text x="530" y="879" font-size="13" fill="var(--muted)">fixing “old cards first” must not</text>
        <text x="530" y="897" font-size="13" fill="var(--muted)">create “new cards first”.</text>
        <text x="530" y="921" font-size="13" fill="var(--rust)">Between two cards still level, the</text>
        <text x="530" y="939" font-size="13" fill="var(--rust)">most-sent one wins — once send</text>
        <text x="530" y="957" font-size="13" fill="var(--rust)">counts are exported. See OPEN_ITEMS 3.</text>

        <line x1="250" y1="944" x2="250" y2="978" stroke="currentColor"
              stroke-width="2" marker-end="url(#a)"/>

        <rect x="30" y="978" width="440" height="56" rx="28"
              fill="var(--signal-wash)" stroke="var(--signal)" stroke-width="2.5"/>
        <text x="250" y="1013" font-size="17" text-anchor="middle" font-weight="700"
              fill="var(--signal)">Cards on screen</text>

        <rect x="530" y="978" width="340" height="56" rx="6"
              fill="none" stroke="var(--signal)" stroke-width="1.5"/>
        <text x="700" y="1002" font-size="15" text-anchor="middle" fill="var(--signal)"
              font-weight="600">39 birthday cards for mothers</text>
        <text x="700" y="1023" font-size="13" text-anchor="middle" fill="var(--muted)">answered in about 1 millisecond</text>
      </g>
    </svg>

    <figcaption>
      <strong>The old search, on the same query:</strong> <em>“Sorry! The search
      query you entered did not find any matching results. Did you mean mom
      <strong>birthday</strong>?”</em> — followed by ten popular cards, of which
      one was a birthday card and the rest were Raksha Bandhan, Lemon Juice Day,
      Women’s Equality Day and National Dog Day. It knew the right spelling well
      enough to suggest it, and did not search for it.
    </figcaption>
  </figure>
</div>
