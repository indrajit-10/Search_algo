<title>How the old search works</title>

<style>
  :root{
    --paper:#ffffff;
    --ink:#16181d;
    --muted:#5c6270;
    --rule:#c9cdd6;
    --hair:#e4e7ec;
    --signal:#0b5fbf;
    --signal-wash:#eaf1fb;
    --rust:#a8341b;
    --rust-wash:#fbeeea;

    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", Menlo,
            Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14161a; --ink:#e7eaf0; --muted:#98a0ae;
      --rule:#333944; --hair:#252a33;
      --signal:#77a9f5; --signal-wash:#1a2331;
      --rust:#e58a70; --rust-wash:#2c1f1c;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14161a; --ink:#e7eaf0; --muted:#98a0ae;
    --rule:#333944; --hair:#252a33;
    --signal:#77a9f5; --signal-wash:#1a2331;
    --rust:#e58a70; --rust-wash:#2c1f1c;
  }
  :root[data-theme="light"]{
    --paper:#ffffff; --ink:#16181d; --muted:#5c6270;
    --rule:#c9cdd6; --hair:#e4e7ec;
    --signal:#0b5fbf; --signal-wash:#eaf1fb;
    --rust:#a8341b; --rust-wash:#fbeeea;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{ max-width:860px; margin:0 auto; padding:44px 32px 60px; }

  .masthead{ border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:22px; }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); margin:0 0 9px;
  }
  h1{
    font-family:var(--serif); font-weight:600; font-size:34px; line-height:1.1;
    margin:0 0 7px; letter-spacing:-.01em;
  }
  .standfirst{ margin:0; max-width:60ch; color:var(--muted); font-size:15.5px; }

  figure{ margin:0; }
  figure svg{ width:100%; height:auto; display:block; }
  figcaption{
    margin-top:14px; padding-top:11px; border-top:1px solid var(--hair);
    font-size:13px; color:var(--muted); max-width:70ch;
  }

  @page{ size:A4 portrait; margin:12mm; }
  @media print{
    :root{
      --paper:#fff; --ink:#000; --muted:#444; --rule:#999; --hair:#ccc;
      --signal:#0b5fbf; --signal-wash:#eaf1fb; --rust:#a8341b; --rust-wash:#fbeeea;
    }
    body{ font-size:10pt; }
    .sheet{ max-width:none; padding:0; }
    h1{ font-size:18pt; margin-bottom:3px; }
    .standfirst{ font-size:9.5pt; max-width:80ch; }
    .masthead{ padding-bottom:7px; margin-bottom:9px; }
    .eyebrow{ font-size:8pt; margin-bottom:5px; }
    /* The whole thing is meant to be one sheet. This is what holds it there. */
    figure svg{ max-height:233mm; width:auto; max-width:100%; margin:0 auto; }
    figcaption{ margin-top:7px; padding-top:6px; font-size:8.5pt; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>

<div class="sheet">

  <header class="masthead">
    <p class="eyebrow">123Greetings &middot; card search</p>
    <h1>How the old search works</h1>
    <p class="standfirst">
      Algorithm v3.2, and the same search making its way through it.
    </p>
  </header>

  <figure>
    <svg viewBox="0 0 900 1010" role="img"
         aria-label="The old Sphinx search in six steps with the query mom birthdya. Someone types mom birthdya. Step one swaps in synonyms from a hand-written list, turning mom into mother. Step two deletes filler words from a list of sixty-eight. Step three checks the spelling and suggests mom birthday, but does not search for it. Step four requires every word to match, and since no card contains birthdya the result is zero. Step five, sorting, never runs because there is nothing to sort. Step six shows an apology and ten popular cards, of which one is a birthday card.">
      <defs>
        <marker id="b" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
        <marker id="bR" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--rust)"/>
        </marker>
      </defs>

      <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
         fill="currentColor" color="currentColor">

        <text x="30" y="18" font-size="12" font-weight="700" fill="var(--muted)"
              letter-spacing="1.2" font-family="ui-monospace, Menlo, monospace">THE STEP</text>
        <text x="530" y="18" font-size="12" font-weight="700" fill="var(--rust)"
              letter-spacing="1.2" font-family="ui-monospace, Menlo, monospace">SOMEONE SEARCHES FOR…</text>

        <rect x="30" y="34" width="440" height="54" rx="27"
              fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="250" y="67" font-size="17" text-anchor="middle" font-weight="600">Someone types</text>

        <rect x="530" y="34" width="340" height="54" rx="6"
              fill="var(--rust-wash)" stroke="var(--rust)" stroke-width="1.5"/>
        <text x="700" y="68" font-size="20" text-anchor="middle" fill="var(--rust)"
              font-family="ui-monospace, Menlo, monospace">mom birthdya</text>

        <line x1="250" y1="88" x2="250" y2="122" stroke="currentColor"
              stroke-width="2" marker-end="url(#b)"/>

        <rect x="30" y="122" width="440" height="86" rx="6"
              fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="54" y="152" font-size="15" font-weight="700">1 &nbsp;Swap in synonyms</text>
        <text x="54" y="177" font-size="14.5" fill="var(--muted)">A hand-written list of 188 pairs. Perfect on</text>
        <text x="54" y="197" font-size="14.5" fill="var(--muted)">those 188 words, silent on the 189th.</text>

        <text x="530" y="158" font-size="16" fill="var(--muted)"
              font-family="ui-monospace, Menlo, monospace">mother birthdya</text>
        <text x="530" y="186" font-size="13" fill="var(--muted)">“mom” is on the list.</text>
        <text x="530" y="204" font-size="13" fill="var(--rust)">So is funny ⇒ fun, which is</text>
        <text x="530" y="221" font-size="13" fill="var(--rust)">why “funny” returns the wrong cards.</text>

        <line x1="250" y1="208" x2="250" y2="242" stroke="currentColor"
              stroke-width="2" marker-end="url(#b)"/>

        <rect x="30" y="242" width="440" height="86" rx="6"
              fill="var(--rust-wash)" stroke="var(--rust)" stroke-width="2"/>
        <text x="54" y="272" font-size="15" font-weight="700" fill="var(--rust)">2 &nbsp;Delete the filler words</text>
        <text x="54" y="297" font-size="14.5" fill="var(--rust)">68 of them, removed before searching:</text>
        <text x="54" y="317" font-size="14" fill="var(--rust)">flash · animated · card · free · happy · wishes</text>

        <text x="530" y="280" font-size="16" fill="var(--muted)"
              font-family="ui-monospace, Menlo, monospace">mother birthdya</text>
        <text x="530" y="306" font-size="13" fill="var(--rust)">Neither word is on the list here —</text>
        <text x="530" y="323" font-size="13" fill="var(--rust)">but “flash card” loses both of its</text>
        <text x="530" y="340" font-size="13" fill="var(--rust)">words and searches for nothing.</text>

        <line x1="250" y1="328" x2="250" y2="362" stroke="currentColor"
              stroke-width="2" marker-end="url(#b)"/>

        <rect x="30" y="362" width="440" height="86" rx="6"
              fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="54" y="392" font-size="15" font-weight="700">3 &nbsp;Check the spelling</text>
        <text x="54" y="417" font-size="14.5" fill="var(--muted)">Works out the right word — and offers it</text>
        <text x="54" y="437" font-size="14.5" fill="var(--muted)">as a question rather than searching for it.</text>

        <text x="530" y="390" font-size="13.5" fill="var(--muted)">The page asks:</text>
        <text x="530" y="410" font-size="14" fill="var(--rust)" font-style="italic">“Did you mean mom birthday?”</text>
        <text x="530" y="434" font-size="13" fill="var(--rust)">It had the answer at this point</text>
        <text x="530" y="451" font-size="13" fill="var(--rust)">and carried on without it.</text>

        <line x1="250" y1="448" x2="250" y2="482" stroke="currentColor"
              stroke-width="2" marker-end="url(#b)"/>

        <rect x="30" y="482" width="440" height="86" rx="6"
              fill="var(--rust-wash)" stroke="var(--rust)" stroke-width="2"/>
        <text x="54" y="512" font-size="15" font-weight="700" fill="var(--rust)">4 &nbsp;Find cards with EVERY word</text>
        <text x="54" y="537" font-size="14.5" fill="var(--rust)">All of them, or nothing at all.</text>
        <text x="54" y="557" font-size="14.5" fill="var(--rust)">There is no middle setting.</text>

        <text x="530" y="512" font-size="13.5" fill="var(--muted)">No card contains “birthdya”,</text>
        <text x="530" y="530" font-size="13.5" fill="var(--muted)">so the whole search fails —</text>
        <text x="530" y="548" font-size="13.5" fill="var(--muted)">even though “mother” matches</text>
        <text x="530" y="566" font-size="13.5" fill="var(--muted)">hundreds of cards.</text>

        <line x1="250" y1="568" x2="250" y2="602" stroke="currentColor"
              stroke-width="2" marker-end="url(#b)"/>

        <path d="M 250 602 L 400 656 L 250 710 L 100 656 Z"
              fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="250" y="650" font-size="15" text-anchor="middle" font-weight="600">Anything</text>
        <text x="250" y="672" font-size="15" text-anchor="middle" font-weight="600">found?</text>

        <line x1="400" y1="656" x2="470" y2="656" stroke="var(--rust)"
              stroke-width="2.5" marker-end="url(#bR)"/>
        <text x="435" y="646" font-size="13" fill="var(--rust)" text-anchor="middle" font-weight="700">no</text>

        <rect x="470" y="624" width="200" height="64" rx="6"
              fill="var(--rust-wash)" stroke="var(--rust)" stroke-width="2.5"/>
        <text x="570" y="650" font-size="15" font-weight="700" text-anchor="middle"
              fill="var(--rust)">Give up</text>
        <text x="570" y="672" font-size="13" text-anchor="middle" fill="var(--rust)">no second attempt</text>

        <!-- Routed down x=500, between the two columns. Straight down from the
             middle of the box crossed the step-5 notes. -->
        <path d="M 500 688 L 500 943 L 524 943" fill="none" stroke="var(--rust)"
              stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#bR)"/>

        <text x="690" y="646" font-size="13" fill="var(--rust)" font-weight="700">64% of all</text>
        <text x="690" y="663" font-size="13" fill="var(--rust)" font-weight="700">searches end</text>
        <text x="690" y="680" font-size="13" fill="var(--rust)" font-weight="700">here.</text>

        <line x1="250" y1="710" x2="250" y2="744" stroke="currentColor"
              stroke-width="2" marker-end="url(#b)"/>
        <text x="262" y="732" font-size="13" fill="var(--muted)">yes</text>

        <rect x="30" y="744" width="440" height="116" rx="6"
              fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="54" y="772" font-size="15" font-weight="700">5 &nbsp;Sort whatever survived</text>
        <text x="54" y="795" font-size="14" fill="var(--muted)">In season, then how many times the words</text>
        <text x="54" y="813" font-size="14" fill="var(--muted)">matched, then sends — recent, then all time.</text>
        <text x="54" y="834" font-size="13" fill="var(--rust)">Every field counts exactly the same:</text>
        <g font-size="11" fill="var(--muted)"
           font-family="ui-monospace, Menlo, monospace">
          <text x="54" y="854">title</text>
          <rect x="88" y="844" width="18" height="11" rx="2" fill="var(--rust)"/>
          <text x="120" y="854">tags</text>
          <rect x="166" y="844" width="18" height="11" rx="2" fill="var(--rust)"/>
          <text x="196" y="854">section</text>
          <rect x="249" y="844" width="18" height="11" rx="2" fill="var(--rust)"/>
          <text x="281" y="854">description</text>
          <rect x="319" y="844" width="18" height="11" rx="2" fill="var(--rust)"/>
        </g>

        <text x="530" y="772" font-size="13" fill="var(--rust)">A word in the description counts</text>
        <text x="530" y="790" font-size="13" fill="var(--rust)">much as one in the title — which</text>
        <text x="530" y="808" font-size="13" fill="var(--rust)">is why prose beats tags.</text>
        <text x="530" y="834" font-size="13" fill="var(--rust)">And lifetime sends decide the rest,</text>
        <text x="530" y="852" font-size="13" fill="var(--rust)">so a 2002 card can never be caught.</text>

        <line x1="250" y1="860" x2="250" y2="908" stroke="currentColor"
              stroke-width="2" marker-end="url(#b)"/>

        <rect x="30" y="908" width="440" height="70" rx="6"
              fill="var(--rust-wash)" stroke="var(--rust)" stroke-width="2.5"/>
        <text x="250" y="936" font-size="15" text-anchor="middle" font-weight="700"
              fill="var(--rust)">6 &nbsp;Apologise, then show</text>
        <text x="250" y="958" font-size="15" text-anchor="middle" font-weight="700"
              fill="var(--rust)">the most popular cards</text>

        <rect x="530" y="908" width="340" height="70" rx="6"
              fill="none" stroke="var(--rust)" stroke-width="1.5"/>
        <text x="700" y="932" font-size="15" text-anchor="middle" fill="var(--rust)"
              font-weight="600">0 matching cards</text>
        <text x="700" y="952" font-size="13" text-anchor="middle" fill="var(--muted)">then 10 popular ones, of which</text>
        <text x="700" y="969" font-size="13" text-anchor="middle" fill="var(--muted)">1 is a birthday card</text>
      </g>
    </svg>

    <figcaption>
      <strong>Every step here works exactly as designed.</strong> The synonym list
      knew “mom”. The spell-check knew “birthday” — it printed the word. What has
      no design at all is the moment after the match fails: there is no second,
      looser attempt, so the search goes from a correct guess to an apology in one
      move. On the same query the new search returns 24 birthday cards for
      mothers.
    </figcaption>
  </figure>
</div>
